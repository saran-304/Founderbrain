openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Authenticated Founderbrain workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: workspaces
  - name: dashboard
  - name: projects
  - name: tasks
  - name: goals
  - name: activity
  - name: teams
  - name: founders
  - name: community
  - name: portfolio
  - name: mentorship
  - name: assistants
  - name: fundraising
  - name: notifications
  - name: settings
  - name: messages
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated account
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces the authenticated user belongs to
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workspace"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get current workspace totals and progress
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List workspace projects
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      responses:
        "204":
          description: Deleted
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List workspace tasks
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      responses:
        "204":
          description: Deleted
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List workspace goals
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
  /goals/{goalId}:
    parameters:
      - name: goalId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      responses:
        "204":
          description: Deleted
  /activity:
    get:
      operationId: listRecentActivity
      tags: [activity]
      summary: Get recent workspace changes
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /workspaces/{workspaceId}/members:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listWorkspaceMembers
      tags: [teams]
      summary: List members of a workspace
      responses:
        "200":
          description: Workspace members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
  /workspaces/{workspaceId}/members/{memberId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceMember
      tags: [teams]
      summary: Change a member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
    delete:
      operationId: removeWorkspaceMember
      tags: [teams]
      summary: Remove a member from a workspace
      responses:
        "204":
          description: Member removed
  /workspaces/{workspaceId}/invitations:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listWorkspaceInvitations
      tags: [teams]
      summary: List pending workspace invitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvitation"
    post:
      operationId: createWorkspaceInvitation
      tags: [teams]
      summary: Create a copyable invitation link
      description: Creates an invitation record only; no email or message is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitationCreated"
  /workspaces/{workspaceId}/join-requests:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listWorkspaceJoinRequests
      tags: [teams]
      summary: List join requests for workspace admins
      responses:
        "200":
          description: Workspace join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceJoinRequest"
    post:
      operationId: createWorkspaceJoinRequest
      tags: [teams]
      summary: Ask to join a workspace using its workspace ID
      responses:
        "201":
          description: Join request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceJoinRequest"
  /workspaces/{workspaceId}/join-requests/me:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMyWorkspaceJoinRequest
      tags: [teams]
      summary: Get the authenticated user's join request for a workspace
      responses:
        "200":
          description: Join request status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceJoinRequest"
  /workspaces/{workspaceId}/join-requests/{requestId}:
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateWorkspaceJoinRequest
      tags: [teams]
      summary: Approve or decline a workspace join request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceJoinRequestUpdate"
      responses:
        "200":
          description: Updated join request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceJoinRequest"
  /invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [teams]
      summary: Accept a workspace invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationAccept"
      responses:
        "200":
          description: Joined workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /founders:
    get:
      operationId: searchFounders
      tags: [founders]
      summary: Search founders who chose to be discoverable
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: skill
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - name: stage
          in: query
          required: false
          schema:
            type: string
            enum: [idea, bootstrapped, pre_seed, seed, series_a, series_b_plus, other]
        - name: lookingForCoFounder
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Discoverable founder profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FounderProfile"
  /founders/me:
    get:
      operationId: getFounderProfile
      tags: [founders]
      summary: Get the authenticated founder's profile
      responses:
        "200":
          description: Founder profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderProfile"
  /founders/{founderId}/portfolio:
    parameters:
      - name: founderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFounderPortfolio
      tags: [portfolio]
      summary: Get a public founder portfolio
      security: []
      responses:
        "200":
          description: Public founder profile and achievements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderPortfolio"
        "404":
          description: Portfolio is private or does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Public portfolio data is not configured in the connected database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateFounderProfile
      tags: [founders]
      summary: Update the authenticated founder's profile and privacy controls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderProfile"
  /connections:
    get:
      operationId: listFounderConnections
      tags: [founders]
      summary: List incoming and outgoing connection requests
      responses:
        "200":
          description: Connection requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FounderConnection"
    post:
      operationId: createFounderConnection
      tags: [founders]
      summary: Send an explicit founder connection request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderConnectionInput"
      responses:
        "201":
          description: Connection request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderConnection"
  /connections/{connectionId}:
    parameters:
      - name: connectionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateFounderConnection
      tags: [founders]
      summary: Accept or decline an incoming connection request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderConnectionUpdate"
      responses:
        "200":
          description: Updated connection request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FounderConnection"
    delete:
      operationId: deleteFounderConnection
      tags: [founders]
      summary: Withdraw or remove a connection
      responses:
        "204":
          description: Connection removed
  /community/posts:
    get:
      operationId: listCommunityPosts
      tags: [community]
      summary: List community posts from authenticated founders
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Community posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Publish a founder-authored community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
  /community/posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCommunityPost
      tags: [community]
      summary: Edit an authored community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityPostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
    delete:
      operationId: deleteCommunityPost
      tags: [community]
      summary: Delete an authored community post
      responses:
        "204":
          description: Post deleted
  /community/posts/{postId}/comments:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCommunityComments
      tags: [community]
      summary: List comments on a post
      responses:
        "200":
          description: Post comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityComment"
    post:
      operationId: createCommunityComment
      tags: [community]
      summary: Comment on a community post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityCommentInput"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityComment"
  /community/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateCommunityComment
      tags: [community]
      summary: Edit an authored comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityCommentUpdate"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityComment"
    delete:
      operationId: deleteCommunityComment
      tags: [community]
      summary: Delete an authored comment
      responses:
        "204":
          description: Comment deleted
  /community/posts/{postId}/reaction:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setCommunityReaction
      tags: [community]
      summary: Add or change the authenticated user's reaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReactionInput"
      responses:
        "200":
          description: Updated reaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReaction"
    delete:
      operationId: deleteCommunityReaction
      tags: [community]
      summary: Remove the authenticated user's reaction
      responses:
        "204":
          description: Reaction removed
  /portfolio/me/achievements:
    get:
      operationId: listMyAchievements
      tags: [portfolio]
      summary: List the authenticated founder's achievements
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"
    post:
      operationId: createAchievement
      tags: [portfolio]
      summary: Add an achievement to the founder's portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementInput"
      responses:
        "201":
          description: Achievement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
  /portfolio/achievements/{achievementId}:
    parameters:
      - name: achievementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateAchievement
      tags: [portfolio]
      summary: Edit an authored achievement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AchievementUpdate"
      responses:
        "200":
          description: Updated achievement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Achievement"
    delete:
      operationId: deleteAchievement
      tags: [portfolio]
      summary: Remove an authored achievement
      responses:
        "204":
          description: Achievement deleted
  /mentorship/questions:
    get:
      operationId: listMentorshipQuestions
      tags: [mentorship]
      summary: List founder mentorship questions
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Mentorship questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorshipQuestion"
    post:
      operationId: createMentorshipQuestion
      tags: [mentorship]
      summary: Ask a mentorship question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorshipQuestionInput"
      responses:
        "201":
          description: Question created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipQuestion"
  /mentorship/questions/{questionId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMentorshipQuestion
      tags: [mentorship]
      summary: Edit an authored mentorship question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorshipQuestionUpdate"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorshipQuestion"
    delete:
      operationId: deleteMentorshipQuestion
      tags: [mentorship]
      summary: Delete an authored mentorship question
      responses:
        "204":
          description: Question deleted
  /mentorship/questions/{questionId}/answers:
    parameters:
      - name: questionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listMentorshipAnswers
      tags: [mentorship]
      summary: List answers to a mentorship question
      responses:
        "200":
          description: Answers
