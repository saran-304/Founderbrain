components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
      required: [id, email, displayName]
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum: [owner, admin, member]
        createdAt:
          type: string
          format: date-time
      required: [id, name, role, createdAt]
    WorkspaceInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required: [name]
    ProjectStatus:
      type: string
      enum: [planning, active, on_hold, completed]
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ProjectStatus"
        targetDate:
          type: ["string", "null"]
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, workspaceId, name, description, status, targetDate, createdAt, updatedAt]
    ProjectInput:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ProjectStatus"
        targetDate:
          type: ["string", "null"]
          format: date
      required: [workspaceId, name]
    ProjectUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: ["string", "null"]
        status:
